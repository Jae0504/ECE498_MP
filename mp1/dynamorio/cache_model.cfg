// 8 simulated cores, virtual addresses, cold start, no prefetcher.
// L1/L2 match sysfs. LLC uses 256 MiB / 16 ways (real 336 MiB / 16 ways
// has non-power-of-two sets, unsupported by caching_device_t).
num_cores 8
line_size 64
warmup_refs 0
skip_refs 0
coherent true
L1I0 {
 type instruction
 core 0
 size 65536
 assoc 16
 parent L2_0
 replace_policy LRU
 prefetcher none
}
L1D0 {
 type data
 core 0
 size 49152
 assoc 12
 parent L2_0
 replace_policy LRU
 prefetcher none
}
L2_0 {
 type unified
 size 2097152
 assoc 16
 parent LLC
 replace_policy LRU
 prefetcher none
}
